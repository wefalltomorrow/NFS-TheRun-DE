name: Build NFSTR Internal Seek Caller

on:
  push:
    branches: [internal-seek-caller-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build Internal Seek Caller v0.1.0
        shell: bash
        run: |
          i686-w64-mingw32-g++ -shared -O2 -std=c++17 -Wall -Wextra \
            -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 \
            tools/diagnostics/NFSTR_InternalSeekCaller_v0.1.0.cpp \
            -o NFSTR_InternalSeekCaller.asi \
            -lkernel32 \
            -static-libgcc -static-libstdc++
          file NFSTR_InternalSeekCaller.asi
          sha256sum NFSTR_InternalSeekCaller.asi | tee NFSTR_InternalSeekCaller.sha256.txt

      - name: Upload Internal Seek Caller
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR_InternalSeekCaller-v0.1.0
          path: |
            NFSTR_InternalSeekCaller.asi
            NFSTR_InternalSeekCaller.sha256.txt
            tools/diagnostics/NFSTR_InternalSeekCaller_v0.1.0.cpp
