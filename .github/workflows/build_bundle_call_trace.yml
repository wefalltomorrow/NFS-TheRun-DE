name: Build NFSTR Bundle Call Trace

on:
  push:
    branches: [bundle-call-trace-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install 32-bit MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686
      - name: Build Bundle Call Trace v0.1.0
        shell: bash
        run: |
          i686-w64-mingw32-g++ -shared -O2 -std=c++17 -Wall -Wextra \
            -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 \
            tools/diagnostics/NFSTR_BundleCallTrace_v0.1.0.cpp \
            -o NFSTR_BundleCallTrace.asi \
            -lkernel32 \
            -static-libgcc -static-libstdc++
          file NFSTR_BundleCallTrace.asi
          sha256sum NFSTR_BundleCallTrace.asi | tee NFSTR_BundleCallTrace.sha256.txt
      - name: Upload Bundle Call Trace
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR_BundleCallTrace-v0.1.0
          path: |
            NFSTR_BundleCallTrace.asi
            NFSTR_BundleCallTrace.sha256.txt
            tools/diagnostics/NFSTR_BundleCallTrace_v0.1.0.cpp
