name: Build NFSTR Runtime File Trace

on:
  push:
    branches: [nfsgame-trace-v0.7-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build Runtime File Trace v0.7.0
        shell: bash
        run: |
          i686-w64-mingw32-g++ -shared -O2 -std=c++17 -Wall -Wextra \
            -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 \
            tools/diagnostics/NFSTR_RuntimeFileTrace_v0.7.0.cpp \
            -o NFSTR_RuntimeFileTrace.asi \
            -lkernel32 \
            -static-libgcc -static-libstdc++
          file NFSTR_RuntimeFileTrace.asi
          sha256sum NFSTR_RuntimeFileTrace.asi | tee NFSTR_RuntimeFileTrace.sha256.txt

      - name: Upload Runtime File Trace
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR_RuntimeFileTrace-v0.7.0
          path: |
            NFSTR_RuntimeFileTrace.asi
            NFSTR_RuntimeFileTrace.sha256.txt
            tools/diagnostics/NFSTR_RuntimeFileTrace_v0.7.0.cpp
