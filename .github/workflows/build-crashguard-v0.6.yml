name: Build NFSTR Crash Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-crashguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build crash guard ASI v0.6.0
        shell: bash
        run: |
          i686-w64-mingw32-g++ -shared -O2 -std=c++17 -Wall -Wextra \
            -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 \
            tools/diagnostics/NFSTR_CrashGuard_v0.6.0.cpp \
            -o NFSTR_CrashGuard.asi \
            -lkernel32 -luser32 \
            -static-libgcc -static-libstdc++
          file NFSTR_CrashGuard.asi
          sha256sum NFSTR_CrashGuard.asi | tee NFSTR_CrashGuard.sha256.txt

      - name: Upload crash guard ASI v0.6.0
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR_CrashGuard-v0.6.0
          path: |
            NFSTR_CrashGuard.asi
            NFSTR_CrashGuard.sha256.txt
            tools/diagnostics/NFSTR_CrashGuard_v0.6.0.cpp
