; NFSTR_Diagnostics.asi
; Standalone observer for Need for Speed: The Run PC v1.1.0.0.
; It does NOT modify Frostbite/game data.

[Diagnostics]
Enabled = 1
Verbose = 1
; 0 = log all paths observed through hooked game/module imports.
; 1 = only paths under the game folder (plus relative paths).
OnlyGameDirectory = 0
MaxLogMB = 256
; Flush high-value FrontEnd/exception/infinite-wait lines immediately.
FlushImportant = 1

[FileIO]
LogCreates = 1
LogReads = 1
LogSeeks = 1
LogSizes = 1
LogMappings = 1
LogAttributes = 1
; Usually unnecessary noise. Enable if handle-lifetime debugging is needed.
LogCloseHandle = 0

[Runtime]
LogModules = 1
LogThreads = 1
LogWaits = 1
LogExceptions = 1
; Finite waits shorter than this are skipped. INFINITE waits are always logged.
MinWaitMs = 25
; Newly loaded modules are rescanned and hooked at this interval.
ModuleScanMs = 250
