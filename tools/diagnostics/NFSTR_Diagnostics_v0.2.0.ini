; NFSTR_Diagnostics.asi v0.2.0
; Standalone observer for Need for Speed: The Run PC v1.1.0.0.
; It does NOT modify Frostbite/game data.

[Diagnostics]
Enabled = 1
Verbose = 1
OnlyGameDirectory = 0
MaxLogMB = 256
FlushImportant = 1

[FileIO]
LogCreates = 1
LogReads = 1
LogSeeks = 1
LogSizes = 1
LogMappings = 1
LogAttributes = 1
LogCloseHandle = 1

[Runtime]
LogModules = 1
LogThreads = 1
LogWaits = 1
LogExceptions = 1
LogSyncObjects = 1
LogCallsites = 1
MinWaitMs = 25
ModuleScanMs = 250
ThreadSnapshots = 1
ThreadSnapshotAfterMs = 1500
ThreadSnapshotIntervalMs = 2000
ThreadSnapshotStackDepth = 8
